<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICD / DSM-5 チェックリスト（教育用）</title>
<style>
  :root{
    --bg:#0b0f13; --panel:#121821; --card:#0f141b; --muted:#7c8da6;
    --text:#e6eef8; --accent:#4da3ff; --ok:#2ecc71; --warn:#f1c40f; --bad:#ff6b6b;
    --chip:#1b2430; --border:#1c2430;
    --radius:14px; --radius-sm:10px; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:linear-gradient(180deg,#0b0f13 0%,#0b0f13 40%,#0e141b 100%);
    color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  }
  header{
    position:sticky;top:0;z-index:10;background:rgba(11,15,19,.7);backdrop-filter:saturate(120%) blur(12px);
    border-bottom:1px solid var(--border);
  }
  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  .title{display:flex;gap:14px;align-items:center;justify-content:space-between}
  .title h1{font-size:18px;margin:0;letter-spacing:.02em;font-weight:700}
  .badge{background:var(--chip);border:1px solid var(--border);padding:4px 8px;border-radius:999px;font-size:12px;color:var(--muted)}
  .controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .select, .toggle{
    background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:8px 12px;
    color:var(--text);display:flex;gap:8px;align-items:center
  }
  select, input[type="search"]{
    background:transparent;border:none;color:var(--text);outline:none;min-width:160px
  }
  input[type="search"]{width:260px}
  main{max-width:1200px;margin:18px auto 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
  @media (max-width:980px){main{grid-template-columns:1fr}}
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)
  }
  .panel h2{margin:0;padding:16px 18px;border-bottom:1px solid var(--border);font-size:15px;color:#cfe0ff}
  .panel-body{padding:16px 18px}
  .search-bar{display:flex;gap:10px;margin-bottom:12px}
  .category{border:1px solid var(--border);background:var(--card);border-radius:12px;margin-bottom:12px}
  .category-header{padding:10px 12px;border-bottom:1px dashed var(--border);color:#d2ddf3;font-size:13px}
  .items{padding:8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  @media (max-width:760px){.items{grid-template-columns:1fr}}
  .item{display:flex;gap:10px;align-items:flex-start}
  .item input{margin-top:4px;transform:scale(1.05)}
  .muted{color:var(--muted);font-size:12px}
  .hint{font-size:12px;color:#c7d5ee;background:#102033;border:1px solid var(--border);padding:8px 10px;border-radius:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{
    background:linear-gradient(180deg,#1a2532,#131b25);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;transition:.15s transform ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn-ghost{background:transparent}
  .results .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px
  }
  .card-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
  .name{font-weight:700}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--border);padding:4px 8px;border-radius:999px;font-size:12px;color:#cfe0ff}
  .chip.ok{background:rgba(46,204,113,.12);border-color:rgba(46,204,113,.35);color:#b8ffd1}
  .chip.warn{background:rgba(241,196,15,.12);border-color:rgba(241,196,15,.35);color:#ffe79d}
  .chip.bad{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.35);color:#ffc1c1}
  .info-btn{
    border:none;background:#152233;border:1px solid var(--border);color:#cfe0ff;width:30px;height:30px;border-radius:999px;cursor:pointer;font-weight:800
  }
  .progress{height:8px;background:#10161f;border-radius:999px;overflow:hidden;border:1px solid var(--border);margin:8px 0 4px}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#38d9a9)}
  .detail{font-size:12px;color:#bfd0e8}
  .empty{color:var(--muted);padding:10px 2px}
  .divider{border-top:1px dashed var(--border);margin:10px 0}
  dialog{
    border:none;border-radius:16px;padding:0;background:var(--panel);color:var(--text);max-width:720px;width:calc(100% - 24px)
  }
  dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-body{padding:14px 18px}
  .close{border:none;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}
  .criteria{display:grid;grid-template-columns:1fr;gap:10px}
  .crit{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--card)}
  .crit b{color:#cfe0ff}
  .sys-title{font-weight:700;margin:8px 0}
  .pill{display:inline-block;background:#1c2c40;border:1px solid var(--border);padding:2px 8px;border-radius:999px;font-size:12px;color:#9cc7ff;margin-right:6px}
  .footnote{font-size:12px;color:#9db1cc;margin-top:8px}
  .disclaimer{font-size:12px;color:#9db1cc}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1>ICD / DSM-5 チェックリスト（教育用）</h1>
      <span class="badge">ローカル実行・個人情報は保存/送信されません</span>
    </div>
    <div class="controls">
      <div class="select">
        対象年齢：
        <select id="ageSelect" aria-label="対象年齢">
          <option value="adult">成人（17歳以上）</option>
          <option value="child">子ども・青年</option>
        </select>
      </div>
      <div class="select">
        評価システム：
        <select id="systemSelect" aria-label="評価システム">
          <option value="both">DSM-5-TR と ICD-11</option>
          <option value="DSM-5-TR">DSM-5-TR のみ</option>
          <option value="ICD-11">ICD-11 のみ</option>
        </select>
      </div>
      <div class="select">
        表示：
        <select id="matchFilter" aria-label="表示フィルタ">
          <option value="all">すべて</option>
          <option value="matched">一致のみ</option>
          <option value="near">候補（未確認あり）</option>
        </select>
      </div>
      <button class="btn btn-ghost" id="resetBtn" title="チェックをすべて外す">リセット</button>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <h2>症状チェック</h2>
    <div class="panel-body">
      <div class="search-bar">
        <div class="select" style="flex:1">
          🔎 <input type="search" id="searchBox" placeholder="キーワードで絞り込み（例：睡眠、食欲、集中…）" aria-label="症状検索">
        </div>
      </div>
      <div id="symptomContainer"></div>
      <div class="divider"></div>
      <div class="disclaimer">
        ※ 本ツールは<strong>診断目的ではありません</strong>。表示項目はDSM-5-TR/ICD‑11の要点を<strong>簡略化・要約</strong>したもので、臨床判断を置き換えるものではありません。
      </div>
    </div>
  </section>

  <section class="panel results">
    <h2>一致した診断（自動判定）</h2>
    <div class="panel-body">
      <div id="resultMatched"></div>
      <div class="divider"></div>
      <h2 style="border:none;padding-top:0">候補（基準の一部が未確認）</h2>
      <div class="panel-body" style="padding-top:6px" id="resultNear"></div>
    </div>
  </section>
</main>

<dialog id="modal">
  <div class="modal-head">
    <div>
      <div id="modalTitle" style="font-weight:800"></div>
      <div id="modalSubtitle" class="muted"></div>
    </div>
    <button class="close" aria-label="閉じる" onclick="modal.close()">×</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</dialog>

<script>
/* ==========================================================
   教育用データセット（要約）。原文の逐語転載はしていません。
   追加や修正は DISORDERS を編集してください。
   各 criteria 内の minCountAdult / minCountChild を指定すると
   年齢によるしきい値を自動で切り替えます。
   ========================================================== */

const DISORDERS = [
  {
    id:'mdd',
    name:'大うつ病性障害（MDD）',
    systems:[
      {
        codeSystem:'DSM-5-TR',
        code:'296.2x / 296.3x',
        criteria:[
          {
            label:'A',
            description:'同じ2週間に 5 つ以上の症状。少なくとも 1 つは「抑うつ気分」または「興味・喜びの喪失」。',
            items:[
              {key:'dep_mood', text:'抑うつ気分がほとんど一日中続く'},
              {key:'anhedonia', text:'興味・喜びの著しい減退'},
              {key:'weight_appetite', text:'体重または食欲の有意な増減'},
              {key:'sleep', text:'不眠または過眠'},
              {key:'psychomotor', text:'精神運動の焦燥または制止（他者が観察可能）'},
              {key:'fatigue', text:'疲労感／エネルギー低下'},
              {key:'worthless_guilt', text:'無価値感／不適切な罪責感'},
              {key:'concentration', text:'集中困難／決断困難'},
              {key:'suicidality', text:'死についての反復思考／自殺念慮・企図'}
            ],
            minCount:5,
            requiredAnyOf:['dep_mood','anhedonia'],
            requiredMin:1
          },
          { label:'B', description:'臨床的に著しい苦痛または機能障害', items:[{key:'impairment', text:'社会・職業などの機能障害'}], minCount:1 },
          { label:'C', description:'物質や他の医学的疾患によらない', items:[{key:'not_substance', text:'物質／身体疾患では説明できない'}], minCount:1 },
          { label:'D', description:'躁病または軽躁病エピソードがない（双極性を示唆しない）', items:[{key:'no_mania', text:'躁病／軽躁病エピソードはない'}], minCount:1 },
          { label:'E', description:'期間条件', items:[{key:'duration_2w', text:'少なくとも 2 週間持続'}], minCount:1 }
        ],
        mustSatisfy:'all'
      },
      {
        codeSystem:'ICD-11',
        code:'6A70',
        criteria:[
          {
            label:'A',
            description:'2 週間以上の持続。中核症状（抑うつ気分／興味の喪失／エネルギー低下）の複数と、その他の症状の合計が一定数以上。',
            items:[
              {key:'dep_mood', text:'抑うつ気分'},
              {key:'anhedonia', text:'興味の喪失'},
              {key:'fatigue', text:'エネルギー低下／易疲労感'},
              {key:'concentration', text:'集中困難'},
              {key:'worthless_guilt', text:'自己評価の低下／罪責感'},
              {key:'sleep', text:'睡眠の障害'},
              {key:'weight_appetite', text:'食欲や体重の変化'},
              {key:'psychomotor', text:'精神運動の変化'},
              {key:'suicidality', text:'死生観の変化／自傷念慮'}
            ],
            minCount:5,
            /* ICD-11 の厳密な重症度規定は簡略化。中核3項目のうち「2つ以上」を推奨チェック */
            requiredAnyOf:['dep_mood','anhedonia','fatigue'],
            requiredMin:2
          },
          { label:'B', description:'明確な苦痛または機能障害', items:[{key:'impairment', text:'機能障害／著しい苦痛'}], minCount:1 },
          { label:'C', description:'物質・身体疾患や躁病では説明されない', items:[{key:'not_substance', text:'物質／身体疾患ではない'},{key:'no_mania', text:'躁病エピソードなし'}], minCount:2 },
          { label:'D', description:'持続期間', items:[{key:'duration_2w', text:'2 週間以上'}], minCount:1 }
        ],
        mustSatisfy:'all'
      }
    ]
  },
  {
    id:'gad',
    name:'全般不安症（GAD）',
    systems:[
      {
        codeSystem:'DSM-5-TR',
        code:'300.02',
        criteria:[
          { label:'A', description:'さまざまな出来事／活動に対する過剰な不安と心配が 6 か月以上、ほとんどの日に存在', items:[{key:'excessive_anxiety_6m', text:'過剰な不安・心配が少なくとも 6 か月'}], minCount:1 },
          { label:'B', description:'心配のコントロール困難', items:[{key:'control_difficult', text:'心配を抑えにくい'}], minCount:1 },
          { label:'C', description:'以下のうち 3 つ以上（子どもは 1 つ以上）', items:[
              {key:'restlessness', text:'落ち着かない／緊張しやすい'},
              {key:'fatigue', text:'疲れやすい'},
              {key:'concentration', text:'集中困難／白紙になる'},
              {key:'irritability', text:'いらだち'},
              {key:'muscle_tension', text:'筋緊張'},
              {key:'sleep', text:'睡眠障害'}
            ],
            minCount:3, minCountChild:1
          },
          { label:'D', description:'臨床的に著しい苦痛または機能障害', items:[{key:'impairment', text:'機能障害'}], minCount:1 },
          { label:'E', description:'物質／他の疾患で説明されない', items:[{key:'not_substance', text:'他の障害／物質ではない'}], minCount:1 }
        ],
        mustSatisfy:'all'
      },
      {
        codeSystem:'ICD-11',
        code:'6B00',
        criteria:[
          { label:'A', description:'過度で広範な不安と心配が数か月以上持続', items:[{key:'excessive_anxiety_6m', text:'過剰な不安が数か月以上'}], minCount:1 },
          { label:'B', description:'緊張関連症状のいくつか', items:[
              {key:'restlessness', text:'落ち着かない'},
              {key:'muscle_tension', text:'筋緊張'},
              {key:'sleep', text:'睡眠の問題'},
              {key:'concentration', text:'集中困難'},
              {key:'irritability', text:'いらだち'},
              {key:'fatigue', text:'疲れやすい'}
            ],
            minCount:2
          },
          { label:'C', description:'苦痛／機能障害', items:[{key:'impairment', text:'機能障害／著しい苦痛'}], minCount:1 },
          { label:'D', description:'他の障害や物質によらない', items:[{key:'not_substance', text:'他の障害／物質ではない'}], minCount:1 }
        ],
        mustSatisfy:'all'
      }
    ]
  },
  {
    id:'adhd',
    name:'注意欠如・多動症（ADHD）',
    systems:[
      {
        codeSystem:'DSM-5-TR',
        code:'314.01',
        criteria:[
          {
            label:'A1',
            description:'不注意：以下のうち必要数が 6 か月以上（成人は 5 つ以上）',
            items:[
              {key:'inattention1', text:'学業／作業でケアレスミスが多い'},
              {key:'inattention2', text:'注意の持続が難しい'},
              {key:'inattention3', text:'話しかけられても聞いていないように見える'},
              {key:'inattention4', text:'指示に従えず課題をやり遂げない'},
              {key:'inattention5', text:'課題や活動の整理が苦手'},
              {key:'inattention6', text:'精神的努力を要する課題を避けがち'},
              {key:'inattention7', text:'必要な物をよく失くす'},
              {key:'inattention8', text:'外的刺激で気が散りやすい'},
              {key:'inattention9', text:'日常活動で忘れっぽい'}
            ],
            minCount:6, minCountAdult:5
          },
          {
            label:'A2',
            description:'多動性・衝動性：以下のうち必要数が 6 か月以上（成人は 5 つ以上）',
            items:[
              {key:'hyper1', text:'手足をそわそわ動かす／もじもじする'},
              {key:'hyper2', text:'座っているべき場面で席を離れる'},
              {key:'hyper3', text:'不適切な場で走り回る／よじ登る（成人は落ち着かない感じ）'},
              {key:'hyper4', text:'静かに遊ぶ・余暇活動が難しい'},
              {key:'hyper5', text:'じっとしていられない（エンジンで動くよう）'},
              {key:'hyper6', text:'しゃべりすぎる'},
              {key:'hyper7', text:'質問が終わる前に答えを急ぐ'},
              {key:'hyper8', text:'順番を待てない'},
              {key:'hyper9', text:'他人をさえぎる／干渉する'}
            ],
            minCount:6, minCountAdult:5
          },
          { label:'B', description:'いくつかの症状が 12 歳以前に存在', items:[{key:'onset_before_12', text:'12 歳以前に症状あり'}], minCount:1 },
          { label:'C', description:'複数の状況で症状（学校／職場／家庭など）', items:[{key:'several_settings', text:'2 つ以上の状況で症状'}], minCount:1 },
          { label:'D', description:'機能障害の明確な証拠', items:[{key:'impairment', text:'機能障害'}], minCount:1 },
          { label:'E', description:'他の障害ではうまく説明されない', items:[{key:'not_substance', text:'他の障害／物質ではない'}], minCount:1 }
        ],
        /* A1 または A2 を満たし、B〜E を満たす */
        mustSatisfy:'A1_or_A2_and_rest'
      },
      {
        codeSystem:'ICD-11',
        code:'6A05',
        criteria:[
          { label:'A', description:'不注意 と／または 多動性・衝動性が持続し、発達早期に始まり、複数の状況でみられ、機能障害をきたす', items:[
              {key:'inattention_present', text:'不注意症状が複数みられる'},
              {key:'hyper_present', text:'多動性・衝動性症状が複数みられる'},
              {key:'onset_before_12', text:'発症は発達期（概ね 12 歳以前）'},
              {key:'several_settings', text:'複数の状況で持続'},
              {key:'impairment', text:'機能障害が明確'}
            ], minCount:4
          },
          { label:'B', description:'他の障害や発達水準では説明されない', items:[{key:'not_substance', text:'他の障害ではない'}], minCount:1 }
        ],
        mustSatisfy:'all'
      }
    ]
  }
];

/* 症状カテゴリ（表示グルーピング） */
const SYMPTOM_CATEGORY = (key)=>({
  'dep_mood':'気分・意欲','anhedonia':'気分・意欲','fatigue':'気分・意欲',
  'weight_appetite':'食欲・体重','sleep':'睡眠','psychomotor':'活動性',
  'worthless_guilt':'自己評価','concentration':'注意・思考','suicidality':'安全・自傷',
  'excessive_anxiety_6m':'不安','control_difficult':'不安','restlessness':'不安','irritability':'不安','muscle_tension':'身体症状',
  'inattention1':'注意・思考','inattention2':'注意・思考','inattention3':'注意・思考','inattention4':'注意・思考','inattention5':'注意・思考','inattention6':'注意・思考','inattention7':'注意・思考','inattention8':'注意・思考','inattention9':'注意・思考',
  'hyper1':'活動性','hyper2':'活動性','hyper3':'活動性','hyper4':'活動性','hyper5':'活動性','hyper6':'活動性','hyper7':'衝動性','hyper8':'衝動性','hyper9':'衝動性',
  'inattention_present':'注意・思考','hyper_present':'活動性',
  'impairment':'機能障害・重症度','duration_2w':'期間・経過','onset_before_12':'発症年齢','several_settings':'複数状況',
  'not_substance':'除外','no_mania':'除外'
}[key] || 'その他');

/* ====== 内部状態 ====== */
const state = {
  age:'adult',
  system:'both',
  checked:new Set(),
  symptomsMaster:new Map(), // key -> {key,text,category}
};

const STORAGE_KEY='icd_dsm_checker_state_v1';

/* ====== ユーティリティ ====== */
const saveState=()=> {
  const payload={age:state.age, system:state.system, checked:[...state.checked]};
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); }catch(e){}
};
const loadState=()=> {
  try{
    const j=localStorage.getItem(STORAGE_KEY);
    if(!j) return;
    const o=JSON.parse(j);
    if(o.age) state.age=o.age;
    if(o.system) state.system=o.system;
    if(Array.isArray(o.checked)) state.checked=new Set(o.checked);
  }catch(e){}
};
const escapeHtml=(s)=>s.replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ====== 症状マスタを生成 ====== */
function buildSymptomMaster(){
  state.symptomsMaster.clear();
  for(const d of DISORDERS){
    for(const sys of d.systems){
      for(const cat of sys.criteria){
        for(const it of cat.items){
          if(!state.symptomsMaster.has(it.key)){
            state.symptomsMaster.set(it.key,{ key:it.key, text:it.text, category:SYMPTOM_CATEGORY(it.key) });
          }
        }
      }
    }
  }
}

/* ====== 症状UIを描画 ====== */
function renderSymptoms(){
  const cont=document.getElementById('symptomContainer');
  cont.innerHTML='';

  // カテゴリ→項目の辞書
  const byCat=new Map();
  for(const it of state.symptomsMaster.values()){
    if(!byCat.has(it.category)) byCat.set(it.category,[]);
    byCat.get(it.category).push(it);
  }
  // 表示順
  const order=['気分・意欲','不安','注意・思考','活動性','衝動性','睡眠','食欲・体重','身体症状','自己評価','安全・自傷','期間・経過','発症年齢','複数状況','機能障害・重症度','除外','その他'];
  const cats=[...byCat.keys()].sort((a,b)=>order.indexOf(a)-order.indexOf(b));

  const q = document.getElementById('searchBox').value.trim().toLowerCase();

  for(const cat of cats){
    const box=document.createElement('div'); box.className='category';
    const header=document.createElement('div'); header.className='category-header'; header.textContent=cat;
    const items=document.createElement('div'); items.className='items';

    const list=byCat.get(cat).slice().sort((a,b)=>a.text.length-b.text.length);
    let visibleCount=0;

    for(const it of list){
      const hidden = q && !(`${it.text}${it.key}`.toLowerCase().includes(q));
      const id=`sym-${it.key}`;
      const row=document.createElement('label'); row.className='item'; row.style.display = hidden ? 'none' : 'flex';
      row.innerHTML=`
        <input type="checkbox" id="${id}" ${state.checked.has(it.key)?'checked':''} aria-label="${escapeHtml(it.text)}">
        <div><div>${escapeHtml(it.text)}</div><div class="muted">${escapeHtml(it.key)}</div></div>
      `;
      row.querySelector('input').addEventListener('change', (ev)=>{
        if(ev.target.checked){ state.checked.add(it.key); } else { state.checked.delete(it.key); }
        saveState(); renderResults();
      });
      items.appendChild(row);
      if(!hidden) visibleCount++;
    }
    if(visibleCount===0) continue;
    box.appendChild(header); box.appendChild(items); cont.appendChild(box);
  }

  // 補足ヒント
  const hint=document.createElement('div'); hint.className='hint';
  hint.innerHTML='「除外」「期間・経過」「機能障害」などの項目もチェックすると、正式一致として判定されます。';
  cont.appendChild(hint);
}

/* ====== 判定ロジック ====== */
function minCountFor(cat){
  if(state.age==='adult' && Number.isFinite(cat.minCountAdult)) return cat.minCountAdult;
  if(state.age==='child' && Number.isFinite(cat.minCountChild)) return cat.minCountChild;
  return cat.minCount ?? 0;
}

function evaluateSpec(systemSpec){
  const details=[];
  let satisfiedAll=true;

  // 特別ルール（ADHD DSM）を扱うために先読み
  const catsByLabel = Object.create(null);
  for(const c of systemSpec.criteria){ catsByLabel[c.label]=c; }

  const resultPerCat=[];
  for(const cat of systemSpec.criteria){
    const min=minCountFor(cat);
    const count = cat.items.filter(it=>state.checked.has(it.key)).length;
    let requiredOk=true;
    if(Array.isArray(cat.requiredAnyOf) && cat.requiredAnyOf.length){
      const reqCount = cat.requiredAnyOf.filter(k=>state.checked.has(k)).length;
      const need = cat.requiredMin ?? 1;
      requiredOk = reqCount>=need;
    }
    const ok = count>=min && requiredOk;
    resultPerCat.push({label:cat.label, min, count, ok, cat});
  }

  let overall=false;
  if(systemSpec.mustSatisfy==='all'){
    overall = resultPerCat.every(r=>r.ok);
  }else if(systemSpec.mustSatisfy==='A1_or_A2_and_rest'){
    const a1 = resultPerCat.find(r=>r.label==='A1');
    const a2 = resultPerCat.find(r=>r.label==='A2');
    const rest = resultPerCat.filter(r=>r.label!=='A1' && r.label!=='A2');
    overall = ((a1?.ok||false) || (a2?.ok||false)) && rest.every(r=>r.ok);
  }else{
    // デフォルトは all
    overall = resultPerCat.every(r=>r.ok);
  }

  // 近接判定（A など主要カテゴリーが満たされ、期間・除外・機能障害等が未確認）
  const coreOk = resultPerCat.some(r=>['A','A1','A2'].includes(r.label) && r.ok);
  const blockers = resultPerCat.filter(r=>!r.ok);
  const near = coreOk && blockers.length>0;

  const satisfiedCount = resultPerCat.filter(r=>r.ok).length;
  const progress = Math.round((satisfiedCount / resultPerCat.length) * 100);

  return {overall, near, resultPerCat, progress};
}

/* ====== 結果描画 ====== */
function renderResults(){
  const targetMatched=document.getElementById('resultMatched');
  const targetNear=document.getElementById('resultNear');
  targetMatched.innerHTML = '';
  targetNear.innerHTML = '';

  const systemFilter = state.system;

  const cardsMatched=[];
  const cardsNear=[];

  for(const d of DISORDERS){
    for(const sys of d.systems){
      if(systemFilter!=='both' && sys.codeSystem!==systemFilter) continue;
      const evalRes = evaluateSpec(sys);
      const card = createResultCard(d, sys, evalRes);
      if(evalRes.overall) cardsMatched.push({progress:evalRes.progress, el:card});
      else if(evalRes.near) cardsNear.push({progress:evalRes.progress, el:card});
    }
  }

  // ソート：進捗が高い順
  cardsMatched.sort((a,b)=>b.progress - a.progress);
  cardsNear.sort((a,b)=>b.progress - a.progress);

  const filterMode = document.getElementById('matchFilter').value;
  if((filterMode==='all' || filterMode==='matched') && cardsMatched.length){
    for(const c of cardsMatched) targetMatched.appendChild(c.el);
  }else{
    targetMatched.innerHTML = '<div class="empty">一致は現在ありません。</div>';
  }
  if((filterMode==='all' || filterMode==='near') && cardsNear.length){
    for(const c of cardsNear) targetNear.appendChild(c.el);
  }else{
    targetNear.innerHTML = '<div class="empty">候補は現在ありません。</div>';
  }
}

function createResultCard(disorder, system, evalRes){
  const card=document.createElement('div'); card.className='card';
  const head=document.createElement('div'); head.className='card-head';

  const left=document.createElement('div');
  left.innerHTML = `
    <div class="name">${escapeHtml(disorder.name)}</div>
    <div class="chips">
      <span class="chip">${escapeHtml(system.codeSystem)} <span class="muted"> ${escapeHtml(system.code)}</span></span>
      ${ evalRes.overall ? '<span class="chip ok">基準を満たす</span>' :
         evalRes.near ? '<span class="chip warn">候補（未確認あり）</span>' :
         '<span class="chip bad">条件不足</span>' }
    </div>
    <div class="progress"><div class="bar" style="width:${evalRes.progress}%"></div></div>
    <div class="detail">基準カテゴリの充足： ${evalRes.resultPerCat.filter(r=>r.ok).length} / ${evalRes.resultPerCat.length}</div>
  `;

  const infoBtn=document.createElement('button'); infoBtn.className='info-btn'; infoBtn.textContent='i';
  infoBtn.title='診断基準（要約）を表示';
  infoBtn.addEventListener('click', ()=>openModal(disorder));
  head.appendChild(left); head.appendChild(infoBtn);

  const body=document.createElement('div');
  body.innerHTML='<div class="divider"></div>';
  // 各カテゴリの充足状況を小さく表示
  const chips=document.createElement('div'); chips.className='chips';
  for(const r of evalRes.resultPerCat){
    const cls = r.ok?'ok':'bad';
    const tip = `${r.label}: ${r.count} / ${r.min}`;
    const span=document.createElement('span'); span.className=`chip ${cls}`;
    span.textContent = `${r.label} ${r.count}/${r.min}`;
    span.title = tip + (r.cat.description?(' — '+r.cat.description):'');
    chips.appendChild(span);
  }
  body.appendChild(chips);

  card.appendChild(head); card.appendChild(body);
  return card;
}

/* ====== モーダル（基準要約表示） ====== */
function openModal(disorder){
  const m=document.getElementById('modal');
  const title=document.getElementById('modalTitle');
  const sub=document.getElementById('modalSubtitle');
  const body=document.getElementById('modalBody');

  title.textContent = disorder.name;
  sub.innerHTML = 'DSM-5-TR / ICD‑11 の<strong>要約</strong>。原文は各公式資料をご参照ください。';

  const wrap=document.createElement('div');

  for(const sys of disorder.systems){
    if(state.system!=='both' && sys.codeSystem!==state.system) continue;
    const section=document.createElement('div'); section.className='criteria';
    const head=document.createElement('div'); head.className='sys-title'; head.innerHTML = `<span class="pill">${escapeHtml(sys.codeSystem)}</span> <span class="muted">${escapeHtml(sys.code)}</span>`;
    wrap.appendChild(head);

    for(const cat of sys.criteria){
      const need = minCountFor(cat);
      const div=document.createElement('div'); div.className='crit';
      const list = cat.items.map(it=>`・${escapeHtml(it.text)}`).join('<br>');
      div.innerHTML = `<b>${escapeHtml(cat.label)}</b>（必要数：${need}）<br><span class="muted">${escapeHtml(cat.description||'')}</span><div style="margin-top:6px">${list}</div>`;
      section.appendChild(div);
    }
    const fn=document.createElement('div'); fn.className='footnote';
    fn.innerHTML='※ 要点を簡略化しています。原典：DSM-5-TR（American Psychiatric Association）／ICD‑11（WHO）。';
    wrap.appendChild(section); wrap.appendChild(fn);
  }

  body.innerHTML=''; body.appendChild(wrap);
  m.showModal();
}

/* ====== 初期化 ====== */
function attachEvents(){
  document.getElementById('ageSelect').value = state.age;
  document.getElementById('systemSelect').value = state.system;

  document.getElementById('ageSelect').addEventListener('change',(e)=>{ state.age=e.target.value; saveState(); renderResults(); });
  document.getElementById('systemSelect').addEventListener('change',(e)=>{ state.system=e.target.value; saveState(); renderResults(); });
  document.getElementById('matchFilter').addEventListener('change',()=>renderResults());
  document.getElementById('searchBox').addEventListener('input',()=>renderSymptoms());
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    state.checked.clear(); saveState(); renderSymptoms(); renderResults();
  });
}

function init(){
  loadState();
  buildSymptomMaster();
  attachEvents();
  renderSymptoms();
  renderResults();
}
document.addEventListener('DOMContentLoaded', init);
</script>
